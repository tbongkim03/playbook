server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── IP 허용목록 게이트 ────────────────────────────────────────────────────
    # prod 는 nginx 가 정적 파일을 직접 서빙하므로 그 요청은 Spring 을 거치지 않는다.
    # IpAllowlistFilter 만으로는 "전체 서비스 차단" 요구를 만족하지 못하고
    # (차단된 IP 에서도 화면은 뜨고 데이터만 안 나옴), 그래서 정적 요청마다
    # /api/ip-gate 로 auth_request 서브요청을 보내 판정한다.
    #
    # auth_request 판정 규칙 (nginx 기본 동작):
    #   2xx        → 통과
    #   401 / 403  → 그 코드로 거부           → @blocked (한국어 안내 페이지)
    #   그 외 전부 → 500 으로 변환            → @failopen (통과)
    #
    # 마지막 줄이 핵심이다. back 이 죽었거나·기동 중이거나·구버전이라
    # /api/ip-gate 가 없으면(404) 전부 500 이 되어 전체 화면이 막힌다.
    # 캠퍼스에 IT 담당자가 없어 이 상태는 복구 불가에 가까우므로
    # 5xx 는 차단을 포기하고 통과시킨다 (Spring 필터의 fail-open 과 같은 방향).

    # 정적 자산은 게이트를 걸지 않는다 (보안감사 S-7).
    #
    # 이 블록이 없으면 페이지 1회 로드가 자산 수십 개 × 서브요청 1건 = back 요청 수십 건이 된다.
    # 그 증폭으로 톰캣 스레드 풀(기본 200)을 포화시키면 /_ipgate 가 3초 타임아웃에 걸리고,
    # 위 error_page 규칙에 따라 fail-open 으로 넘어가 **공격자가 스스로 차단을 풀 수 있다.**
    #
    # 자산만 받아가는 것은 SPA 껍데기 노출과 동등해서 실질 손실이 없다 —
    # 데이터는 전부 /api/ 뒤에 있고, 그쪽은 IpAllowlistFilter 가 직접 판정한다.
    # 즉 "문서 요청 1건에만 게이트를 건다"로 보호 수준은 유지하면서 증폭만 없앤다.
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|map)$ {
        auth_request off;
        try_files $uri =404;

        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        auth_request /_ipgate;
        try_files $uri /index.html;

        # 차단 — 원래 상태코드(401/403)를 유지한 채 안내 페이지를 보여준다.
        # '=' 를 붙이지 않아야 403 이 200 으로 바뀌지 않는다.
        error_page 401 403 @blocked;

        # fail-open — '=' 를 붙여 500 을 @failopen 의 결과(200)로 갈아끼운다.
        error_page 500 502 503 504 = @failopen;
    }

    # auth_request 서브요청 전용. internal 이라 외부에서 직접 못 부른다.
    location = /_ipgate {
        internal;
        proxy_pass http://back:8080/api/ip-gate;

        # 판정에 본문은 필요 없다 — 헤더만 보낸다.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # 필터가 클라이언트 IP 를 판정하는 근거.
        # X-Forwarded-For 는 $proxy_add_x_forwarded_for(= "$http_x_forwarded_for, $remote_addr")
        # 가 아니라 $remote_addr 로 **덮어쓴다**. 전자는 클라이언트가 보낸 값을 맨 앞에 이어붙여
        # `curl -H "X-Forwarded-For: 127.0.0.1"` 한 줄로 차단이 전면 우회된다 (보안감사 S-1, CRITICAL).
        # 캠퍼스 구성은 클라이언트 → nginx 1홉이므로 $remote_addr 이 곧 실제 클라이언트다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # back 이 멈춰 있을 때 자산 요청마다 기본 60초를 기다리면 화면이 통째로 멎는다.
        # 짧게 끊어서 즉시 5xx → fail-open 경로로 넘긴다.
        proxy_connect_timeout 2s;
        proxy_send_timeout    3s;
        proxy_read_timeout    3s;
    }

    # 차단된 IP 안내 페이지. auth_request 를 끄지 않으면 다시 403 이 나 무한 루프가 된다.
    location @blocked {
        auth_request off;
        charset utf-8;
        root /usr/share/nginx/errors;
        try_files /ip-blocked.html =403;
        add_header Cache-Control "no-store" always;
    }

    # back 장애 시 통과 경로. 여기서도 auth_request 를 끈다.
    # 원래 요청 URI 를 그대로 다시 태워 정적 자산·SPA 라우팅이 정상 동작하게 한다.
    location @failopen {
        auth_request off;
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 백엔드 API 프록시
    # 여기엔 auth_request 를 걸지 않는다 — /api 요청은 IpAllowlistFilter 가 직접 판정하므로
    # 게이트를 또 걸면 요청마다 서브요청이 한 번 더 발생할 뿐이다.
    location /api/ {
        proxy_pass http://back:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # S-1: 클라이언트가 보낸 XFF 는 이어붙이지 않고 버린다. $proxy_add_x_forwarded_for 금지.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger 프록시
    # location /swagger-ui {
    #     proxy_pass http://back:8080/swagger-ui/index.html/;
    # }
}
