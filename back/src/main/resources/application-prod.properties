spring.datasource.url=jdbc:mysql://db:3306/playbookdb
spring.datasource.username=${DB_USERNAME:produser}
spring.datasource.password=${DB_PASSWORD:prodpass}

# 운영 스키마는 마이그레이션 SQL로만 바꾼다. Hibernate가 운영 테이블을 건드리지 못하게 validate 고정.
# 엔티티↔스키마 불일치로 기동이 막히면 JPA_DDL_AUTO=none 으로 즉시 우회 가능.
# (application.properties 의 공통 ddl-auto=update 를 이 프로파일 값이 덮어쓴다 —
#  Spring Boot 는 application-{profile}.properties 를 application.properties 보다 우선한다.)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.data.redis.host=redis
spring.data.redis.port=6379

spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session
spring.session.redis.repository-type=indexed
spring.session.timeout=3600

# 운영은 기본 차단. nginx가 프론트와 /api를 같은 오리진으로 서빙하므로 교차 출처 요청이 없다.
# 다른 도메인에서 붙여야 하면 배포 시 .env 에 CORS_ALLOWED_ORIGINS 로 실제 도메인만 지정한다
# (쉼표 구분. "*" 는 세션 쿠키가 임의 출처로 실려 나가므로 기동 시 거부된다).
playbook.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Actuator는 메인 API(8080)와 다른 포트로 격리 → 호스트에 미매핑하면 같은 prod-network의 Alloy만 접근(외부 비노출).
# 별도 포트라 context-path(/api)·MVC 인터셉터를 타지 않아 경로는 /actuator/prometheus, 무인증 scrape.
management.server.port=${MANAGEMENT_PORT:8081}

# ── IP 허용목록 차단 (캠퍼스 내부망 전용 운영) ────────────────────────────────
# 허용 IP는 tb_allowed_ip 에 저장하고 관리자탭에서 CRUD 한다. 운영에서만 차단이 켜진다.
#
# enabled 를 환경변수로 빼둔 이유: 관리자가 자기 IP를 잘못 등록해 서비스에서 잠겼을 때
# 이미지 재빌드 없이 .env.prod 한 줄 수정 + 컨테이너 재시작만으로 차단을 끌 수 있어야 한다.
playbook.ip-allowlist.enabled=${IP_ALLOWLIST_ENABLED:true}

# nginx 가 프론트와 /api 를 프록시하므로 백엔드가 보는 원격주소는 항상 nginx 컨테이너 IP다.
# 이 대역에서 온 요청에 한해 X-Forwarded-For 의 **마지막 항목**을 실제 클라이언트로 신뢰한다.
# (첫 항목은 클라이언트가 위조할 수 있다 — 보안감사 S-1 CRITICAL 참조)
#
# 값은 docker-compose.prod.yml 의 prod-network subnet 과 **반드시 일치**해야 한다.
# 어긋나면 nginx 가 신뢰 프록시로 인식되지 않아 XFF 를 통째로 무시하고,
# 모든 요청이 nginx IP 하나로 보여 차단이 오작동한다.
# ⚠ 이 값이 비면 기동 시 WARN 로그가 남고 차단이 사실상 무력화된다.
playbook.ip-allowlist.trusted-proxies=${IP_ALLOWLIST_TRUSTED_PROXIES:172.31.240.0/24}

# 상시허용 내부망 — 의도적으로 **비워 둔다** (보안감사 S-2, HIGH).
# 예전에는 172.16.0.0/12 를 넣었는데, 그게 trusted-proxies 와 같은 값이라
# XFF 해석에 실패했을 때 폴백된 nginx IP 가 곧바로 상시허용에 매칭되어
# "차단"이 아니라 "전면 허용"이 됐다.
#
# 지금은 nginx 만이 백엔드를 호출하고 그건 trusted-proxies 로 처리된다.
# 루프백(127.0.0.1, ::1)은 이 설정과 무관하게 항상 허용되므로 관리실 로컬 접속도 안전하다.
# 값을 채울 때는 trusted-proxies 와 겹치지 않게 하라 — 겹치면 기동 시 ERROR 로그가 남는다.
playbook.ip-allowlist.internal-networks=${IP_ALLOWLIST_INTERNAL_NETWORKS:}

# 비상 우회(IP_ALLOWLIST_BYPASS)와 최초 시딩(IP_ALLOWLIST_BOOTSTRAP)은 코드에서 환경변수를
# 직접 읽으므로 여기 선언하지 않는다. 설치 마법사가 .env.prod 에 채운다.