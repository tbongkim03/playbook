spring.application.name=back

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# 연동 시크릿(봇 토큰·API 키) DB 저장 시 AES 암호화 키. 운영은 배포 시 별도 지정.
# 프로퍼티명을 env 이름과 다르게 둔다 — 같으면 자기참조가 되어 env 미설정 시
# Circular placeholder 로 기동이 실패하고 기본값도 적용되지 않는다.
integration.secret-key=${INTEGRATION_SECRET_KEY:defaultSecretKeyForJWT123456789}

MASTER_ID=${MASTER_ID:admin}
MASTER_PW=${MASTER_PW:admin1234}
MASTER_NAME=${MASTER_NAME:관리자}
MASTER_DISCORD=${MASTER_DISCORD:bubble_94}

CLIENT_ID=${CLIENT_ID:naver.api.client.id}
CLIENT_SECRET=${CLIENT_SECRET:naver.api.client.secret}

NL_API_KEY=${NL_API_KEY:nl.api.isbn.key}
WORK24_API_KEY=${WORK24_API_KEY:work24.api.course.key}

DISCORD_CHANNEL_SEOCHO=${DISCORD_CHANNEL_SEOCHO:}
DISCORD_CHANNEL_GVALLEY=${DISCORD_CHANNEL_GVALLEY:}
DISCORD_CHANNEL_DONGJAK=${DISCORD_CHANNEL_DONGJAK:}
DISCORD_LINK_CHANNEL_ID=${DISCORD_LINK_CHANNEL_ID:}

# 중앙 모니터링 토큰 자동 회전 (캠퍼스 배포에서만 enabled=true). 미설정 시 빈·스케줄러 미생성.
monitoring.token.refresh.enabled=${MONITORING_REFRESH_ENABLED:false}
monitoring.token.refresh.interval-ms=${MONITORING_REFRESH_INTERVAL_MS:302400000}
monitoring.token.refresh.initial-delay-ms=${MONITORING_REFRESH_INITIAL_DELAY_MS:60000}
monitoring.token.endpoint=${MONITORING_TOKEN_ENDPOINT:https://playbook-monitor.com/auth/token}
monitoring.token.campus=${MONITORING_CAMPUS:}
monitoring.token.access-token=${MONITORING_ACCESS_TOKEN:}
monitoring.token.bootstrap-secret=${MONITORING_BOOTSTRAP_SECRET:}
monitoring.token.file=${MONITORING_TOKEN_FILE:/monitoring/access_token}

# Actuator — Alloy가 scrape할 prometheus 메트릭만 노출(health 포함). 외부 직접 노출 금지(프로파일별 management.server.port로 격리).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

server.servlet.context-path=/api

# 도서 엑셀 업로드 등 파일 업로드 크기 한도
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
