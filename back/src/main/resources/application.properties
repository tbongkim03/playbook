spring.application.name=back

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# 연동 시크릿(봇 토큰·API 키) DB 저장 시 AES 암호화 키. 운영은 배포 시 별도 지정.
# 프로퍼티명을 env 이름과 다르게 둔다 — 같으면 자기참조가 되어 env 미설정 시
# Circular placeholder 로 기동이 실패하고 기본값도 적용되지 않는다.
integration.secret-key=${INTEGRATION_SECRET_KEY:defaultSecretKeyForJWT123456789}

MASTER_ID=${MASTER_ID:admin}
MASTER_PW=${MASTER_PW:admin1234}
MASTER_NAME=${MASTER_NAME:관리자}
MASTER_DISCORD=${MASTER_DISCORD:bubble_94}

# KAKAO_REST_API_KEY (카카오 책 검색 표지 조회) 는 여기에 선언하지 않는다 — IntegrationService 의 @Value 기본값이 처리한다

NL_API_KEY=${NL_API_KEY:nl.api.isbn.key}
WORK24_API_KEY=${WORK24_API_KEY:work24.api.course.key}

DISCORD_CHANNEL_SEOCHO=${DISCORD_CHANNEL_SEOCHO:}
DISCORD_CHANNEL_GVALLEY=${DISCORD_CHANNEL_GVALLEY:}
DISCORD_CHANNEL_DONGJAK=${DISCORD_CHANNEL_DONGJAK:}
DISCORD_LINK_CHANNEL_ID=${DISCORD_LINK_CHANNEL_ID:}

# ── 설치 마법사가 .env 로 공급하는 값 (여기에 선언하지 않는다) ────────────────
# DISCORD_ROLE_SEOCHO / _GVALLEY / _DONGJAK
#   디스코드 캠퍼스 역할 ID. 마법사가 서버에 역할을 자동 생성한 뒤 채운다.
#   플북 계정 연동 시 이 역할이 부여되어 소속 캠퍼스 채널이 해금된다.
#   tb_campus_channel 이 비어 있을 때만 시드되므로 연동 화면에서 고친 값을 덮어쓰지 않는다.
# INITIAL_CAMPUS_NAME / INITIAL_CAMPUS_LOCATION
#   신규 설치 최초 캠퍼스. tb_campus 가 0행일 때만 1건 생성한다.
#
# ⚠ 이 키들을 위의 DISCORD_CHANNEL_* 처럼 "이름=달러중괄호 같은이름 콜론" 형태로 선언하지 마라.
#    그 형태는 프로퍼티명과 플레이스홀더명이 같아 자기참조가 되고, 값을 공급하는
#    .env 가 없는 환경(테스트 등)에서 `Circular placeholder reference` 로 기동이 실패한다.
#    DISCORD_CHANNEL_* 이 멀쩡한 건 .env.test 가 그 값을 실제로 공급하기 때문일 뿐이다.
#    코드의 @Value 기본값(빈 문자열)만으로 충분하므로 여기에 다시 적지 않는다.

# 중앙 모니터링 토큰 자동 회전 (캠퍼스 배포에서만 enabled=true). 미설정 시 빈·스케줄러 미생성.
monitoring.token.refresh.enabled=${MONITORING_REFRESH_ENABLED:false}
monitoring.token.refresh.interval-ms=${MONITORING_REFRESH_INTERVAL_MS:302400000}
monitoring.token.refresh.initial-delay-ms=${MONITORING_REFRESH_INITIAL_DELAY_MS:60000}
# 도메인 변경(2026-08-04): playbook-monitor.com → monitoring.tbongkim.com.
# 구 도메인은 중앙 nginx 가 더는 인증서를 내주지 않아 TLS 오류가 난다.
monitoring.token.endpoint=${MONITORING_TOKEN_ENDPOINT:https://monitoring.tbongkim.com/auth/token}
monitoring.token.campus=${MONITORING_CAMPUS:}
monitoring.token.access-token=${MONITORING_ACCESS_TOKEN:}
monitoring.token.bootstrap-secret=${MONITORING_BOOTSTRAP_SECRET:}
monitoring.token.file=${MONITORING_TOKEN_FILE:/monitoring/access_token}

# Actuator — Alloy가 scrape할 prometheus 메트릭만 노출(health 포함). 외부 직접 노출 금지(프로파일별 management.server.port로 격리).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

server.servlet.context-path=/api

# CORS 허용 출처 (쉼표 구분). 빈 값이면 CORS 매핑을 아예 등록하지 않는다 = 교차 출처 전면 차단.
# 배포 환경에서는 nginx가 /api/ 를 백엔드로 프록시하므로 브라우저 요청이 같은 오리진이고
# CORS 자체를 타지 않는다. 이 목록은 프론트를 API와 다른 오리진에서 띄우는 로컬 개발용 안전망이다.
# allowCredentials(true) 와 함께 쓰므로 "*" 는 금지 — WebConfig 가 기동 시 거부한다.
# 프로퍼티명이 env 이름(CORS_ALLOWED_ORIGINS)의 완화 바인딩 키(cors.allowed-origins)와
# 겹치지 않도록 playbook. 접두사를 둔다 (위 integration.secret-key 와 같은 이유).
playbook.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:8081}

# 도서 엑셀 업로드 등 파일 업로드 크기 한도
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
