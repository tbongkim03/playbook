spring.application.name=back

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

BASE_KEY=${BASE_KEY:defaultSecretKeyForJWT123456789}

MASTER_ID=${MASTER_ID:admin}
MASTER_PW=${MASTER_PW:admin1234}
MASTER_NAME=${MASTER_NAME:???}
MASTER_DISCORD=${MASTER_DISCORD:bubble_94}

CLIENT_ID=${CLIENT_ID:naver.api.client.id}
CLIENT_SECRET=${CLIENT_SECRET:naver.api.client.secret}

NL_API_KEY=${NL_API_KEY:nl.api.isbn.key}
WORK24_API_KEY=${WORK24_API_KEY:work24.api.course.key}

DISCORD_CHANNEL_SEOCHO=${DISCORD_CHANNEL_SEOCHO:discord.channel.seocho}
DISCORD_CHANNEL_GVALLEY=${DISCORD_CHANNEL_GVALLEY:discord.channel.gvalley}
DISCORD_CHANNEL_DONGJAK=${DISCORD_CHANNEL_DONGJAK:discord.channel.dongjak}

server.servlet.context-path=/api
