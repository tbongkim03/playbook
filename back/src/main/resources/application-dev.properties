spring.datasource.url=jdbc:mysql://db-dev:3306/playbookdb_dev
spring.datasource.username=${DB_USERNAME:devuser}
spring.datasource.password=${DB_PASSWORD:devpass}

spring.data.redis.host=redis-dev
spring.data.redis.port=6379

spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session
spring.session.redis.repository-type=indexed
spring.session.timeout=3600

# 개발서버는 nginx가 프론트와 /api를 같은 오리진으로 서빙하므로 교차 출처 요청이 없다.
# 기본 차단. 별도 오리진에서 붙여야 하면 .env.dev 에 CORS_ALLOWED_ORIGINS 를 지정한다
# (쉼표 구분, 예: http://203.0.113.10 — "*" 는 거부된다).
playbook.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
