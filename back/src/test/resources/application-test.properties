# DB - 로컬 개발 DB 사용 (테스트 데이터는 test_ 접두사 + teardown SQL로 정리)
spring.datasource.url=jdbc:mysql://localhost:3307/playbookdb_local
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update

# Embedded Redis - 로컬 Redis(6380)와 충돌 방지
spring.data.redis.host=localhost
spring.data.redis.port=6381

# Session
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session:test
spring.session.redis.repository-type=indexed
spring.session.timeout=3600

# ── IP 허용목록 ──────────────────────────────────────────────────────────────
# 차단은 기본 비활성. 켜두면 테스트가 자기 자신을 잠글 수 있다.
playbook.ip-allowlist.enabled=false

# 자기차단 방지 케이스(계약서 3·4·5번의 4001/4002)를 재현하려면 요청자가 루프백이 아니어야 한다.
# 루프백이면 어차피 잠기지 않으므로 서비스가 자기차단 검사를 건너뛰기 때문이다.
# 127.0.0.1 을 신뢰 프록시로 두면 테스트에서 X-Forwarded-For: 203.0.113.5 헤더로
# 임의의 클라이언트 IP를 가장할 수 있다. 이 설정이 없으면 QA가 "4002가 안 나온다"고 오탐한다.
playbook.ip-allowlist.trusted-proxies=127.0.0.1

# 로그 최소화
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.playbook.encore=INFO

