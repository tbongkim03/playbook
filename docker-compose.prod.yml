services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: back-prod
    env_file:
      - ./back/.env.prod
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - prod-network

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: db
    env_file:
      - ./db/.env.prod
    ports:
      - "6603:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - prod-network

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front-prod
    ports:
      - "8081:8080"
    networks:
      - prod-network

volumes:
  db-data:

networks:
  prod-network:
    driver: bridge



