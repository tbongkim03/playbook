services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: back-prod
    env_file:
      - ./back/.env.prod
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prod-network

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: db
    env_file:
      - ./db/.env.prod
    ports:
      - "6603:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - prod-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    networks:
      - prod-network

  front:
    build:
      context: ./front
      dockerfile: ProdDockerfile
    container_name: front-prod
    ports:
      - "80:80"
    depends_on:
      - back
    networks:
      - prod-network

volumes:
  db-data:

networks:
  prod-network:
    driver: bridge



